    <!--splash-->
    <style>
      html.kirana-splash, html.kirana-splash body { background:#0a5950 }
      #ksplash { position:fixed; inset:0; z-index:9999; background:radial-gradient(120% 80% at 50% 38%,#0f7366 0%,#0a5950 55%,#08463f 100%);
        display:grid; place-items:center; transition:opacity .35s ease; }
      #ksplash.out { opacity:0; pointer-events:none }
      #ksplash .ks { display:grid; justify-items:center; gap:22px; transform:translateY(-4%) }
      #ksplash .tile { position:relative; width:104px; height:104px; border-radius:30px; background:#fff; display:grid; place-items:center;
        box-shadow:0 18px 40px rgba(0,0,0,.25); overflow:hidden; animation:ksPop .7s cubic-bezier(.2,1.4,.4,1) both }
      #ksplash .tile::after { content:""; position:absolute; inset:-40%; background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.85) 50%,transparent 60%);
        transform:translateX(-120%); animation:ksShine 2.4s ease-in-out .95s infinite both }
      #ksplash .ring { position:absolute; width:104px; height:104px; border-radius:34px; border:2px solid rgba(249,215,48,.55); animation:ksRing 1.6s ease-out .5s infinite both }
      #ksplash .k { width:76px; height:76px }
      #ksplash .star { transform-origin:58px 63.5px; animation:ksStar .8s cubic-bezier(.3,1.5,.5,1) .35s both, ksTw 1.6s ease-in-out 1.25s infinite }
      #ksplash .wm { width:176px; height:auto; opacity:0; animation:ksUp .6s ease-out .75s both }
      #ksplash .tag { margin:-10px 0 0; font:600 13px system-ui,sans-serif; letter-spacing:.3px; color:rgba(255,255,255,.72); opacity:0; animation:ksUp .6s ease-out 1s both }
      @keyframes ksPop { from { opacity:0; transform:scale(.45) } to { opacity:1; transform:scale(1) } }
      @keyframes ksStar { from { opacity:0; transform:rotate(-120deg) scale(0) } to { opacity:1; transform:rotate(0) scale(1) } }
      @keyframes ksTw { 50% { transform:scale(1.25) rotate(15deg) } }
      @keyframes ksShine { 0% { transform:translateX(-120%) } 40%, 100% { transform:translateX(120%) } }
      #ksplash .dots { display:flex; gap:7px; margin-top:6px; opacity:0; animation:ksUp .5s ease-out 1.3s both }
      #ksplash .dots i { width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.85); animation:ksDot 1.2s ease-in-out infinite }
      #ksplash .dots i:nth-child(2) { animation-delay:.2s } #ksplash .dots i:nth-child(3) { animation-delay:.4s }
      @keyframes ksDot { 0%, 100% { opacity:.3; transform:scale(.8) } 50% { opacity:1; transform:scale(1.15) } }
      @keyframes ksRing { from { opacity:1; transform:scale(1) } to { opacity:0; transform:scale(1.9) } }
      @keyframes ksUp { from { opacity:0; transform:translateY(14px) } to { opacity:1; transform:none } }
      @media (prefers-reduced-motion:reduce) { #ksplash *, #ksplash *::after { animation:none !important; opacity:1 !important } }
    </style>
